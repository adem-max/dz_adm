# Lint and tests on every push. Based on the workflow `bench new-app` writes
# (Frappe 16, frappe/utils/boilerplate.py), with Frappe and ERPNext on version-16.
# The hub reads dz_core and dz_cod from the bench without installing them:
# both are taken at the branch (or tag) of the same name when it exists, else at main.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pre-commit/action@v3.0.1

  tests:
    name: Tests (dz_hub)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Bench with Frappe, ERPNext 16, dafter-core and dafter-cod
        run: |
          # A branch, or a release tag: siblings at the same branch or tag (v0.4.0 needs
          # dz_core v0.4.0, which main may not have yet), else at main
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          same_or_main() {
            if git ls-remote --exit-code --heads --tags "https://github.com/adem-max/$1" "$BRANCH" > /dev/null; then echo "$BRANCH"; else echo main; fi
          }
          CORE=$(same_or_main dafter-core)
          COD=$(same_or_main dafter-cod)
          echo "dafter-core at $CORE, dafter-cod at $COD"
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench get-app --skip-assets --branch version-16 erpnext
          bench get-app --skip-assets --branch "$CORE" https://github.com/adem-max/dafter-core
          bench get-app --skip-assets --branch "$COD" https://github.com/adem-max/dafter-cod
          bench get-app --skip-assets dz_hub "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench build

      - name: Hub test site (ERPNext + dz_hub; dz_core and dz_cod stay on the bench only)
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext dz_hub
          bench --site test_site set-config allow_tests true

      - name: dz_hub tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app dz_hub
